name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT: eigenweltlabs-training
  REGION: europe-west1
  SERVICE: legaloss
  IMAGE: europe-west1-docker.pkg.dev/eigenweltlabs-training/legaloss/app

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" \
            --build-arg NEXT_PUBLIC_POSTHOG_KEY="${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}" \
            --build-arg NEXT_PUBLIC_POSTHOG_HOST="https://eu.i.posthog.com" \
            -t "$IMAGE:${{ github.sha }}" .

      - name: Push image
        run: docker push "$IMAGE:${{ github.sha }}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT" \
            --region "$REGION" \
            --image "$IMAGE:${{ github.sha }}" \
            --no-invoker-iam-check \
            --min-instances 0 \
            --max-instances 1 \
            --memory 512Mi \
            --service-account legaloss-run@eigenweltlabs-training.iam.gserviceaccount.com \
            --set-env-vars "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }},NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in,NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up,LITESTREAM_BUCKET=eigenweltlabs-training-legaloss-db,SEED_STARTERS=0,ADMIN_USER_IDS=${{ secrets.ADMIN_USER_IDS }},ADMIN_API_TOKEN=${{ secrets.ADMIN_API_TOKEN }},BREVO_API_KEY=${{ secrets.BREVO_API_KEY }},BREVO_LIST_ID=${{ secrets.BREVO_LIST_ID }}" \
            --set-secrets "CLERK_SECRET_KEY=legaloss-clerk-secret-key:latest,GITHUB_TOKEN=legaloss-github-token:latest"
